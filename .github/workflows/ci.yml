name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  headless:
    name: Headless / ${{ matrix.os }} / Rust ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable]
        include:
          - os: ubuntu-latest
            toolchain: 1.99.0
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      RUSTDOCFLAGS: -D warnings
      CARGO_TERM_COLOR: always
      # Each integration test links a separate binary; full debuginfo makes
      # them large enough to fill the Linux runner disk and exceed the
      # Windows PDB limit. Incremental caches are never reused in CI.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Run the examples' headless sessions
        # The features are those the workspace build above unifies (the
        # gallery adds png, svg and cpu), so the examples it built are reused,
        # and diagram_editor's CPU export runs. Each session bounds its own
        # waits; the timeout contains a hang that slips through.
        timeout-minutes: 10
        shell: bash
        run: |
          cargo run --locked -p pert-ui --features png,svg,cpu --example live_mixer
          cargo run --locked -p pert-ui --features png,svg,cpu --example dynamic_documents
          cargo run --locked -p pert-ui --features png,svg,cpu --example diagram_editor
          cargo run --locked -p pert-ui --features png,svg,cpu --example log_explorer -- --lines 10000
          cargo run --locked -p pert-ui --features png,svg,cpu --example inventory -- --items 2000
      - run: cargo test --locked --workspace --doc
      - run: cargo test --locked --release --workspace
      - name: Model-check the live-data protocols with loom
        if: runner.os == 'Linux'
        run: cargo test --locked -p pert-ui-core --test loom --release
        env:
          RUSTFLAGS: --cfg loom
      - run: cargo doc --locked --workspace --no-deps
      - run: cargo clippy --locked -p pert-ui --no-default-features --all-targets -- -D warnings
      - run: cargo test --locked -p pert-ui --no-default-features
      - run: cargo doc --locked -p pert-ui --no-default-features --no-deps
      - name: Reclaim build artifacts before image and SVG checks
        run: cargo clean
      - run: cargo clippy --locked -p pert-ui --features image-formats --all-targets -- -D warnings
      - run: cargo test --locked -p pert-ui --features image-formats
      - run: cargo doc --locked -p pert-ui --features image-formats --no-deps
      - run: cargo clippy --locked -p pert-ui --no-default-features --features png --all-targets -- -D warnings
      - run: cargo test --locked -p pert-ui --no-default-features --features png
      - run: cargo clippy --locked -p pert-ui --features images --all-targets -- -D warnings
      - run: cargo test --locked -p pert-ui --features images
      - run: cargo clippy --locked -p pert-ui --features svg --all-targets -- -D warnings
      - run: cargo test --locked -p pert-ui --features svg
      - run: cargo doc --locked -p pert-ui --features svg --no-deps
      - run: cargo clippy --locked -p pert-ui --no-default-features --features svg --all-targets -- -D warnings
      - run: cargo test --locked -p pert-ui --no-default-features --features svg
      - name: Reclaim build artifacts before serde and CPU checks
        run: cargo clean
      - run: cargo clippy --locked -p pert-ui --features serde --all-targets -- -D warnings
      - run: cargo test --locked -p pert-ui --features serde
      - run: cargo doc --locked -p pert-ui --features serde --no-deps
      - run: cargo clippy --locked -p pert-ui --no-default-features --features serde --all-targets -- -D warnings
      - run: cargo test --locked -p pert-ui --no-default-features --features serde
      - run: cargo clippy --locked -p pert-ui-core --features serde --all-targets -- -D warnings
      - run: cargo test --locked -p pert-ui-core --features serde
      - run: cargo clippy --locked -p pert-ui --features cpu --all-targets -- -D warnings
      - run: cargo test --locked -p pert-ui --features cpu
      - run: cargo doc --locked -p pert-ui --features cpu --no-deps
      - run: cargo clippy --locked -p pert-ui --no-default-features --features desktop-cpu --all-targets -- -D warnings
      - run: cargo test --locked -p pert-ui --no-default-features --features desktop-cpu
      - run: cargo doc --locked -p pert-ui --no-default-features --features desktop-cpu --no-deps
      - run: cargo run --locked -p pert-ui-gallery -- --headless
      - name: Reclaim build artifacts before packaging
        run: cargo clean
      - name: Inspect library contents
        run: cargo package --locked --workspace --exclude pert-ui-gallery --exclude pert-ui-native-checks --list
      - name: Verify library packages
        run: cargo package --locked --workspace --exclude pert-ui-gallery --exclude pert-ui-native-checks
