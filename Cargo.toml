[workspace]
members = ["crates/pert-ui-core", "crates/pert-ui-runtime", "crates/pert-ui-cpu", "crates/pert-ui-wgpu", "crates/pert-ui", "apps/gallery", "apps/native-checks"]
resolver = "3"

[workspace.package]
version = "0.3.51"
edition = "2024"
rust-version = "1.99.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pertyjons/pert-ui"

[workspace.dependencies]
pert-ui-core = { version = "0.3.51", path = "crates/pert-ui-core" }
pert-ui = { version = "0.3.51", path = "crates/pert-ui" }
pert-ui-runtime = { version = "0.3.51", path = "crates/pert-ui-runtime" }
pert-ui-wgpu = { version = "0.3.51", path = "crates/pert-ui-wgpu" }
pert-ui-cpu = { version = "0.3.51", path = "crates/pert-ui-cpu" }
thiserror = "2.0.21"
# Opt-in `Serialize`/`Deserialize` for the owned diagnostic and document types.
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = "1.0.154"
parley = { version = "0.12.0", default-features = false, features = ["std", "complex-scripts"] }
swash = "0.2.10"
unicode-segmentation = "1.13.3"
pollster = "1.0.1"
loom = "0.7.2"
arboard = { version = "3.7.0", default-features = false }
winit = { version = "0.30.13", default-features = false }
wgpu = { version = "30.0.1", default-features = false }
softbuffer = { version = "0.4.8", default-features = false }
# Only the format decoders; `rayon` would add a background thread pool.
image = { version = "0.25.10", default-features = false }
# No text, system fonts or memory-mapped fonts: SVG text is deliberately
# unsupported, which keeps a second font registry out of the dependency graph.
resvg = { version = "0.48.1", default-features = false }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
# Every public function or trait method returning `Result` states its failures
# in an `# Errors` section; see the error policy in docs/contracts.md.
missing_errors_doc = "deny"

[profile.release]
debug-assertions = false
