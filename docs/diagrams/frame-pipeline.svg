<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="title desc">
  <title id="title">From an event to a presented frame</title>
  <desc id="desc">The App translates operating-system events into runtime input. Components handle the input and write state, which invalidates only its readers. A flush updates, measures and arranges the invalidated components, the runtime paints a DisplayList, and the chosen presenter draws it with the GPU or the CPU. The event loop then waits for the next event or deadline.</desc>
  <style>
    .bg { fill: #f8fafc; }
    .text { fill: #0f172a; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .muted { fill: #475569; }
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; }
    .h1 { font-size: 22px; font-weight: 700; }
    .sub { font-size: 13px; }
    .lane-label { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; }
    .label { font-size: 13px; font-weight: 600; }
    .body { font-size: 12px; }
    .small { font-size: 11px; }
    .card { fill: #ffffff; stroke: #e2e8f0; }
    .note { fill: none; stroke: #94a3b8; stroke-dasharray: 4 3; }
    .lane-facade { fill: #eef2ff; stroke: #c7d2fe; }
    .lane-runtime { fill: #f0fdfa; stroke: #99f6e4; }
    .lane-renderer { fill: #f5f3ff; stroke: #ddd6fe; }
    .accent-facade { fill: #4338ca; }
    .accent-runtime { fill: #0f766e; }
    .accent-renderer { fill: #6d28d9; }
    .badge-text { fill: #ffffff; font-size: 11px; font-weight: 700; }
    .edge { stroke: #64748b; stroke-width: 1.6; fill: none; }
    .head { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1120; }
      .text { fill: #e2e8f0; }
      .muted { fill: #94a3b8; }
      .card { fill: #111827; stroke: #334155; }
      .note { stroke: #64748b; }
      .lane-facade { fill: #1e1b4b; stroke: #3730a3; }
      .lane-runtime { fill: #042f2e; stroke: #115e59; }
      .lane-renderer { fill: #2e1065; stroke: #5b21b6; }
      .accent-facade { fill: #a5b4fc; }
      .accent-runtime { fill: #5eead4; }
      .accent-renderer { fill: #c4b5fd; }
      .badge-text { fill: #0b1120; }
      .edge { stroke: #94a3b8; }
      .head { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="700" rx="16"/>

  <text class="text h1" x="40" y="46">From an event to a presented frame</text>
  <text class="text muted sub" x="40" y="70">One UI thread drives the runtime. Work happens only when an event, a state change or a deadline asks for it.</text>

  <!-- Lanes -->
  <rect class="lane-facade" x="40" y="92" width="880" height="140" rx="12"/>
  <text class="text lane-label accent-facade" transform="translate(62 162) rotate(-90)" text-anchor="middle">pert-ui App</text>
  <rect class="lane-runtime" x="40" y="244" width="880" height="184" rx="12"/>
  <text class="text lane-label accent-runtime" transform="translate(62 336) rotate(-90)" text-anchor="middle">pert-ui-runtime</text>
  <rect class="lane-renderer" x="40" y="440" width="880" height="120" rx="12"/>
  <text class="text lane-label accent-renderer" transform="translate(62 500) rotate(-90)" text-anchor="middle">renderer</text>

  <!-- 1 Event or wake -->
  <rect class="card" x="84" y="116" width="210" height="100" rx="8"/>
  <circle class="accent-facade" cx="106" cy="138" r="11"/>
  <text class="text badge-text" x="106" y="142" text-anchor="middle">1</text>
  <text class="text label" x="124" y="143">Event or wake</text>
  <text class="text muted body" x="98" y="168">OS input, resize, scale change,</text>
  <text class="text muted body" x="98" y="185">a due deadline, a mailbox,</text>
  <text class="text muted body" x="98" y="202">live data or inspection wake</text>

  <!-- 2 Translate -->
  <rect class="card" x="330" y="116" width="200" height="100" rx="8"/>
  <circle class="accent-facade" cx="352" cy="138" r="11"/>
  <text class="text badge-text" x="352" y="142" text-anchor="middle">2</text>
  <text class="text label" x="370" y="143">Translate</text>
  <text class="text muted body" x="344" y="168">winit events become input:</text>
  <text class="text muted small mono" x="344" y="185">pointer_input, key_input,</text>
  <text class="text muted small mono" x="344" y="201">text_preedit, text_input</text>

  <!-- 7 Wait -->
  <rect class="card" x="556" y="116" width="344" height="100" rx="8"/>
  <circle class="accent-facade" cx="578" cy="138" r="11"/>
  <text class="text badge-text" x="578" y="142" text-anchor="middle">7</text>
  <text class="text label" x="596" y="143">Wait</text>
  <text class="text muted small mono" x="570" y="168">ControlFlow::WaitUntil(next_deadline)</text>
  <text class="text muted body" x="570" y="186">or Wait: with nothing due, the event loop</text>
  <text class="text muted body" x="570" y="203">sleeps until the next event or wake.</text>

  <!-- Retained note -->
  <rect class="note" x="84" y="268" width="210" height="140" rx="8"/>
  <text class="text label" x="98" y="294">Retained</text>
  <text class="text muted body" x="98" y="318">Unchanged components keep</text>
  <text class="text muted body" x="98" y="335">their layout, text and</text>
  <text class="text muted body" x="98" y="352">drawing. Hidden and fully</text>
  <text class="text muted body" x="98" y="369">clipped views do no</text>
  <text class="text muted body" x="98" y="386">presentation work.</text>

  <!-- 3 Event phase -->
  <rect class="card" x="330" y="268" width="200" height="140" rx="8"/>
  <circle class="accent-runtime" cx="352" cy="290" r="11"/>
  <text class="text badge-text" x="352" y="294" text-anchor="middle">3</text>
  <text class="text label" x="370" y="295">Event phase</text>
  <text class="text muted body" x="344" y="318">The target component handles</text>
  <text class="text muted body" x="344" y="335">the input and writes a Signal</text>
  <text class="text muted body" x="344" y="352">or starts a Parameter edit.</text>
  <text class="text muted body" x="344" y="369">Writes invalidate only the</text>
  <text class="text muted body" x="344" y="386">readers of that state.</text>

  <!-- 4 Flush -->
  <rect class="card" x="556" y="268" width="165" height="140" rx="8"/>
  <circle class="accent-runtime" cx="578" cy="290" r="11"/>
  <text class="text badge-text" x="578" y="294" text-anchor="middle">4</text>
  <text class="text label mono" x="596" y="295">flush(now)</text>
  <text class="text muted body" x="570" y="318">Update invalidated</text>
  <text class="text muted body" x="570" y="335">components, measure,</text>
  <text class="text muted body" x="570" y="352">arrange, then deliver</text>
  <text class="text muted body" x="570" y="369">notifications and</text>
  <text class="text muted body" x="570" y="386">inspection replies.</text>

  <!-- 5 Paint -->
  <rect class="card" x="747" y="268" width="153" height="140" rx="8"/>
  <circle class="accent-runtime" cx="769" cy="290" r="11"/>
  <text class="text badge-text" x="769" y="294" text-anchor="middle">5</text>
  <text class="text label mono" x="787" y="295">paint()</text>
  <text class="text muted body" x="761" y="318">Painter records an</text>
  <text class="text muted body" x="761" y="335">ordered DisplayList:</text>
  <text class="text muted body" x="761" y="352">fills, masks, images,</text>
  <text class="text muted body" x="761" y="369">vectors and clips.</text>
  <text class="text muted small" x="761" y="392">only when needs_paint</text>

  <!-- Captures note -->
  <rect class="note" x="84" y="460" width="446" height="80" rx="8"/>
  <text class="text label" x="98" y="484">Captures</text>
  <text class="text muted body" x="98" y="506">A CaptureRequest is rendered from the runtime's scene by the</text>
  <text class="text muted body" x="98" y="523">active presenter into an owned FrameImage, with its frame state.</text>

  <!-- 6 Present -->
  <rect class="card" x="556" y="460" width="165" height="80" rx="8"/>
  <circle class="accent-renderer" cx="578" cy="482" r="11"/>
  <text class="text badge-text" x="578" y="486" text-anchor="middle">6</text>
  <text class="text label" x="596" y="487">GPU (default)</text>
  <text class="text muted body" x="570" y="510">pert-ui-wgpu draws to</text>
  <text class="text muted body" x="570" y="527">the window surface</text>

  <rect class="card" x="747" y="460" width="153" height="80" rx="8"/>
  <circle class="accent-renderer" cx="769" cy="482" r="11"/>
  <text class="text badge-text" x="769" y="486" text-anchor="middle">6</text>
  <text class="text label" x="787" y="487">Software</text>
  <text class="text muted body" x="761" y="510">pert-ui-cpu fills a</text>
  <text class="text muted body" x="761" y="527">softbuffer frame</text>

  <!-- Edges -->
  <path class="edge" d="M294 166 H328" marker-end="url(#arrow)"/>
  <path class="edge" d="M430 216 V266" marker-end="url(#arrow)"/>
  <path class="edge" d="M530 338 H554" marker-end="url(#arrow)"/>
  <path class="edge" d="M721 338 H745" marker-end="url(#arrow)"/>
  <path class="edge" d="M823 408 V458" marker-end="url(#arrow)"/>
  <path class="edge" d="M823 434 H638 V458" marker-end="url(#arrow)"/>
  <path class="edge" d="M900 500 H910 V166 H902" marker-end="url(#arrow)"/>
  <path class="edge" d="M638 540 V550 H910 V500"/>
  <path class="edge" d="M728 116 V104 H189 V114" marker-end="url(#arrow)"/>

  <!-- Footer -->
  <text class="text muted body" x="40" y="592">The App chooses one presenter at startup; App::software_rendering selects the CPU path, and nothing switches mid-session.</text>
  <text class="text muted body" x="40" y="614">Input entry points settle in a flush of their own. Mailbox values, timers and live sources enter at step 4 without an input event.</text>
  <text class="text muted body" x="40" y="636">A settled application has no pending input, state change or deadline: nothing is updated, painted or presented until something arrives.</text>
</svg>
